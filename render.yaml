services:
  - type: web
    name: agrisight-ai
    runtime: python
    plan: free
    buildCommand: |
      cd backend && pip install --no-cache-dir -r requirements.txt
      cd ../frontend && npm ci && npm run build
    startCommand: cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./agripulse.db
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_MODE
        value: false
      - key: ENVIRONMENT
        value: production
      - key: WEATHER_PROVIDER
        value: open_meteo
      - key: SATELLITE_PROVIDER
        value: copernicus
      - key: AI_PROVIDER
        value: mock
      - key: PAYMENT_PROVIDER
        value: mock
      - key: APP_URL
        value: https://agrisight-ai.onrender.com
      - key: VITE_API_URL
        value: /api
